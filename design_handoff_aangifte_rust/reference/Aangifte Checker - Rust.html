<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Aangifte Checker — Rust</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #f6f5f2;
    --paper-2: #efece4;
    --card: #ffffff;
    --ink: #23201b;
    --ink-2: #4c463c;
    --ink-3: #867e70;
    --ink-4: #aaa495;
    --line: #e7e3d9;
    --line-2: #dbd5c8;
    --bronze: #9a6d34;
    --bronze-d: #7c5728;
    --bronze-bg: #f4ebdd;
    --bronze-line: #e6d4ba;

    /* refined, muted semantic colors */
    --pos: #4e7256;  --pos-bg: #e9f0e6;  --pos-line: #cadcc1;
    --warn: #a87716; --warn-bg: #f7eed9; --warn-line: #ecd9ad;
    --info: #3e6c80; --info-bg: #e4f0f3; --info-line: #c6e0e6;
    --attn: #7c596d; --attn-bg: #f2e9ee; --attn-line: #e3d1da;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: "Geist", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1; }
  .mono { font-family: "Geist Mono", monospace; }

  .tone-pos  { --c: var(--pos);  --cbg: var(--pos-bg);  --cln: var(--pos-line); }
  .tone-warn { --c: var(--warn); --cbg: var(--warn-bg); --cln: var(--warn-line); }
  .tone-info { --c: var(--info); --cbg: var(--info-bg); --cln: var(--info-line); }
  .tone-attn { --c: var(--attn); --cbg: var(--attn-bg); --cln: var(--attn-line); }

  .page { max-width: 720px; margin: 0 auto; padding: 26px 26px 90px; }

  /* sticky app bar */
  .topbar { position: sticky; top: 0; z-index: 10; background: color-mix(in oklab, var(--paper) 86%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
  .topbar-inner { max-width: 720px; margin: 0 auto; padding: 12px 26px; display: flex; align-items: center; gap: 14px; }
  .topbar .spacer { flex: 1; }
  .ghostbtn { display: inline-flex; align-items: center; gap: 7px; font-family: inherit; font-size: 13px; font-weight: 600; white-space: nowrap; color: var(--ink-2); background: var(--card); border: 1px solid var(--line-2); border-radius: 999px; padding: 8px 15px; cursor: pointer; transition: border-color .12s, color .12s; }
  .ghostbtn:hover { border-color: var(--bronze); color: var(--bronze); }

  /* brand */
  .brand { display: flex; align-items: center; gap: 11px; }
  .brand .logo { width: 36px; height: 36px; border-radius: 11px; background: var(--bronze); color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 6px -1px rgba(154,109,52,.45); }
  .brand .wm { font-size: 16.5px; font-weight: 600; letter-spacing: -.01em; white-space: nowrap; }
  .brand .sub { font-size: 12px; color: var(--ink-3); margin-top: 1px; }

  /* uploaded files strip */
  .files { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; box-shadow: 0 1px 2px rgba(35,32,27,.04); }
  .files .grp { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .files .lab { font-size: 11px; color: var(--ink-4); font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .fchip { display: inline-flex; align-items: center; gap: 6px; background: var(--paper); border: 1px solid var(--line-2); color: var(--ink-2); font-size: 12px; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
  .fchip.ok { background: var(--pos-bg); border-color: var(--pos-line); color: var(--pos); }
  .files .edit { margin-left: auto; font-size: 12.5px; font-weight: 600; color: var(--bronze); background: none; border: 0; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }

  .eyebrow { font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--bronze); }
  .h-res { font-size: 26px; font-weight: 600; letter-spacing: -.02em; margin: 4px 0 0; }
  .h-sub { font-size: 13.5px; color: var(--ink-3); margin: 4px 0 0; }

  /* ── summary boxes side-by-side (with a dash of color) ── */
  .statrow { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
  .stat { position: relative; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px 17px 15px; overflow: hidden; box-shadow: 0 1px 2px rgba(35,32,27,.04), 0 10px 26px -20px rgba(35,32,27,.3); }
  .stat-top { display: flex; align-items: center; gap: 12px; }
  .stat .chip { width: 34px; height: 34px; border-radius: 10px; background: var(--c); color: #fff; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; box-shadow: 0 2px 5px -1px color-mix(in oklab, var(--c) 50%, transparent); }
  .stat .n { font-family: "Geist Mono", monospace; font-size: 30px; font-weight: 600; line-height: 1; color: var(--c); }
  .stat .l { font-size: 12.5px; color: var(--ink-2); font-weight: 500; margin-top: 12px; line-height: 1.3; }

  /* section cards */
  .sec { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: 0 1px 2px rgba(35,32,27,.04); }
  .sechead { display: flex; align-items: center; gap: 11px; padding: 15px 18px; border-bottom: 1px solid var(--cln); background: var(--cbg); }
  .sechead .chip { width: 30px; height: 30px; border-radius: 9px; background: var(--c); color: #fff; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .sechead .t { font-size: 15px; font-weight: 600; }
  .sechead .note { font-size: 12px; color: var(--ink-3); margin-top: 1px; }
  .sechead .pill { margin-left: auto; font-family: "Geist Mono", monospace; font-size: 12px; color: var(--c); background: var(--cbg); border: 1px solid var(--cln); border-radius: 999px; padding: 2px 11px; }
  .irow { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 13px 18px; border-bottom: 1px solid var(--line); }
  .irow:last-child { border-bottom: 0; }
  .irow .f { font-size: 14px; font-weight: 500; color: var(--ink); }
  .irow .m { font-size: 12px; color: var(--ink-3); margin-top: 2px; }
  .irow .a { font-family: "Geist Mono", monospace; font-size: 14.5px; font-weight: 600; white-space: nowrap; }

  /* attention */
  .ahead { display: flex; align-items: center; gap: 10px; }
  .ahead .ic { color: var(--attn); display: flex; }
  .ahead h2 { font-size: 17px; font-weight: 600; margin: 0; }
  .ahead .pill { font-family: "Geist Mono", monospace; font-size: 12px; color: var(--attn); background: var(--attn-bg); border: 1px solid var(--attn-line); border-radius: 999px; padding: 2px 10px; }

  .acard { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; box-shadow: 0 1px 2px rgba(35,32,27,.04); transition: opacity .2s; }
  .acard.resolved { opacity: .6; background: var(--paper); }
  .acard .head { display: flex; gap: 12px; }
  .acard .chip { width: 32px; height: 32px; border-radius: 9px; background: var(--attn-bg); color: var(--attn); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
  .acard.resolved .chip { background: var(--pos-bg); color: var(--pos); }
  .acard .t { font-size: 15px; font-weight: 600; }
  .acard.resolved .t { text-decoration: line-through; color: var(--ink-3); }
  .acard .x { font-size: 13.5px; line-height: 1.55; color: var(--ink-2); margin-top: 3px; }
  .acard .meta { font-size: 11.5px; color: var(--ink-4); margin-top: 7px; }
  .actions { display: flex; gap: 8px; margin-top: 13px; }
  .gbtn { font-size: 12.5px; font-weight: 600; color: var(--attn); background: var(--attn-bg); border: 0; border-radius: 999px; padding: 7px 13px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; transition: filter .12s; }
  .gbtn:hover { filter: brightness(.96); }
  .gbtn.mute { color: var(--ink-3); background: var(--paper-2); margin-left: auto; }
  .gbtn.mute.on { color: var(--pos); background: var(--pos-bg); }

  .thread { margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; }
  .bubble { font-size: 13px; line-height: 1.5; padding: 10px 13px; border-radius: 14px; margin-bottom: 8px; max-width: 86%; width: fit-content; }
  .bubble.u { background: var(--ink); color: var(--paper); align-self: flex-end; border-bottom-right-radius: 4px; }
  .bubble.a { background: var(--paper-2); color: var(--ink); align-self: flex-start; border-bottom-left-radius: 4px; }
  .bubble.a strong { font-weight: 600; }
  .typing { font-size: 12px; color: var(--ink-4); font-style: italic; margin: 2px 4px 8px; align-self: flex-start; }
  .chatin { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
  .chatin input { flex: 1; border: 1px solid var(--line-2); background: var(--paper); border-radius: 999px; padding: 10px 16px; font-family: inherit; font-size: 13px; color: var(--ink); outline: none; transition: border-color .12s, box-shadow .12s; }
  .chatin input:focus { border-color: var(--attn); box-shadow: 0 0 0 3px var(--attn-bg); }
  .chatin input::placeholder { color: var(--ink-4); }
  .chatin button { border: 0; background: var(--attn); color: #fff; width: 40px; height: 40px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; flex: 0 0 40px; transition: filter .12s; }
  .chatin button:hover { filter: brightness(1.08); }
  .chatin button:disabled { opacity: .4; cursor: not-allowed; }

  /* incremental */
  .icard { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 18px; box-shadow: 0 1px 2px rgba(35,32,27,.04); }
  .drop { border: 1.5px dashed var(--line-2); border-radius: 13px; background: var(--paper); padding: 22px; text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
  .drop:hover { border-color: var(--bronze); background: var(--bronze-bg); }
  .dropic { width: 44px; height: 44px; border-radius: 12px; background: #fff; border: 1px solid var(--line); color: var(--bronze); display: flex; align-items: center; justify-content: center; margin: 0 auto 11px; }
  .drop .dl { font-size: 14px; font-weight: 600; }
  .drop .dh { font-size: 12px; color: var(--ink-3); margin-top: 4px; }
  .btn { width: 100%; border: 0; background: var(--bronze); color: #fff; padding: 14px; border-radius: 999px; font-family: inherit; font-size: 14.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 9px; cursor: pointer; transition: background .15s, transform .1s; }
  .btn:hover { background: var(--bronze-d); }
  .btn:active { transform: translateY(1px); }

  .stack > * + * { margin-top: 14px; }
  .disc { font-size: 11.5px; color: var(--ink-4); text-align: center; margin-top: 26px; }

  /* report body layout */
  .col-main > * + * { margin-top: 14px; }
  .col-side > * + * { margin-top: 16px; }
  .col-side { margin-top: 30px; }

  @media (min-width: 1040px) {
    .page { max-width: 1440px; padding: 30px 40px 100px; }
    .topbar-inner { max-width: 1440px; padding-left: 40px; padding-right: 40px; }
    .statrow { gap: 16px; }
    .body { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(400px, 1fr); gap: 28px; align-items: start; }
    .body.single { display: block; }
    .col-side { margin-top: 0; align-self: start; }
  }

  @media (max-width: 560px) {
    .statrow { grid-template-columns: repeat(2, 1fr); }
  }

  @media (max-width: 440px) {
    .ghostbtn .lbl { display: none; }
    .ghostbtn { padding: 8px; }
    .brand .sub { display: none; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="src/shared.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="src/rust-app.jsx"></script>
</body>
</html>
