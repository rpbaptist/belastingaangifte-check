<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Saxo Bank jaaroverzicht 2023 (synthetic fixture)</title>
    <style>
      /*
        Synthetic jaaropgave fixture (#106, ADR 0009). Every text run is absolutely
        positioned: there is NO table markup. All names, account IDs and amounts are
        invented.

        Layout under test: a broker statement showing a cash (geldrekening) balance and a
        portfolio (beleggingen) value for the same account at the same date. Both belong on
        one AccountData — a negative cash balance and a portfolio value above ten thousand
        must not be merged into a single number or split into two account entries.
      */
      @page {
        size: A4;
        margin: 0;
      }
      html,
      body {
        margin: 0;
        padding: 0;
      }
      .page {
        position: relative;
        width: 210mm;
        height: 297mm;
        overflow: hidden;
        font-family: "DejaVu Sans", sans-serif;
        color: #111;
      }
      .run {
        position: absolute;
        font-size: 11px;
        line-height: 14px;
        white-space: nowrap;
      }
      .title {
        font-size: 15px;
        font-weight: bold;
      }
      .section {
        font-size: 13px;
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <section class="page">
      <div class="run title" style="top: 15mm; left: 24mm">Saxo Bank</div>
      <div class="run" style="top: 22mm; left: 24mm">Jaaroverzicht beleggen 2023</div>
      <div class="run" style="top: 29mm; left: 24mm">
        J. Fictief &nbsp; Rekeningnummer: SAXO1234567
      </div>

      <div class="run section" style="top: 45mm; left: 24mm">Beleggingsrekening</div>
      <div class="run" style="top: 54mm; left: 24mm">Geldrekening saldo per 01-01-2023: € -450</div>
      <div class="run" style="top: 62mm; left: 24mm">
        Beleggingen saldo per 01-01-2023: € 14.780
      </div>
    </section>
  </body>
</html>
